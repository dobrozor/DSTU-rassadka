<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Театральная рассадка</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0e14;
            --surface: #1a1825;
            --surface2: #221f32;
            --border: #2e2a45;
            --gold: #c9a84c;
            --gold-light: #e8c96b;
            --gold-dim: rgba(201,168,76,0.15);
            --selected: #4a7dfc;
            --text: #e8e4f0;
            --text-muted: #6e6a85;
            --seat-free: #1e1c2e;
            --seat-border: #3a3658;
            --aisle: 28px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        /* ── HEADER ── */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 10px; z-index: 1000;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        .header-brand { font-family:'Playfair Display',serif; font-size:18px; color:var(--gold); letter-spacing:2px; margin-right:8px; white-space:nowrap; }
        .divider { width:1px; height:32px; background:var(--border); margin:0 4px; }
        .input-group { display:flex; align-items:center; background:var(--surface2); border:1px solid var(--border); border-radius:8px; overflow:hidden; transition:border-color 0.2s; }
        .input-group:focus-within { border-color: var(--gold); }
        #groupInput { background:transparent; border:none; outline:none; color:var(--text); font-family:'Inter',sans-serif; font-size:13px; padding:8px 12px; width:170px; }
        #groupInput::placeholder { color:var(--text-muted); }
        #colorPicker { width:36px; height:100%; border:none; border-left:1px solid var(--border); background:transparent; cursor:pointer; padding:4px; }
        .btn { display:flex; align-items:center; gap:5px; padding:8px 13px; border:1px solid transparent; border-radius:8px; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; font-weight:500; letter-spacing:0.3px; transition:all 0.15s; white-space:nowrap; }
        .btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
        .btn:active { transform:translateY(0); }
        .btn-primary { background:var(--gold); color:#1a1200; border-color:var(--gold); }
        .btn-danger { background:transparent; color:#fc6a6a; border-color:#fc6a6a44; }
        .btn-danger:hover { background:rgba(252,106,106,0.1); }
        .btn-ghost { background:transparent; color:var(--text-muted); border-color:var(--border); }
        .btn-ghost:hover { color:var(--text); background:var(--surface2); }
        .btn-export { background:var(--surface2); color:var(--gold); border-color:var(--gold-dim); }
        .btn-export:hover { border-color:var(--gold); }
        #counter { font-family:'DM Mono',monospace; font-size:12px; color:var(--text-muted); margin-left:auto; white-space:nowrap; }
        #counter b { color:var(--gold); }

        /* ── STATS ── */
        .stats-panel { position:fixed; right:16px; top:80px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; width:200px; max-height:calc(100vh - 120px); overflow-y:auto; z-index:900; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
        .stats-panel::-webkit-scrollbar { width:4px; }
        .stats-panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
        .stats-title { font-family:'Playfair Display',serif; font-size:13px; color:var(--gold); letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
        .stat-row { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12px; border-bottom:1px solid var(--border); }
        .stat-row:last-child { border-bottom:none; }
        .stat-color { width:12px; height:12px; border-radius:3px; flex-shrink:0; border:1px solid rgba(255,255,255,0.1); }
        .stat-name { flex-grow:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .stat-count { color:var(--gold); font-family:'DM Mono',monospace; font-size:11px; font-weight:500; }
        .stats-empty { color:var(--text-muted); font-size:11px; text-align:center; padding:10px 0; }

        /* ── ZOOM ── */
        #zoom-container { position:fixed; top:64px; left:0; right:0; bottom:40px; cursor:grab; overflow:hidden; }
        #zoom-container:active { cursor:grabbing; }
        #hall-wrapper { display:inline-block; padding:300px; transform-origin:0 0; }

        /* ── HALL ── */
        .hall-viewport { display:flex; flex-direction:column; align-items:center; }
        .sector-container { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:36px 50px; margin-bottom:40px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:flex; flex-direction:column; align-items:center; }
        #parter-sector { min-width:1350px; }
        .sector-title { font-family:'Playfair Display',serif; font-size:14px; font-weight:600; color:var(--text-muted); letter-spacing:8px; text-transform:uppercase; margin-bottom:28px; }
        .parter-layout-container { display:flex; align-items:flex-start; gap:36px; }
        .side-balcony-wrapper { display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:44px; }
        .side-balcony-container { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 14px; box-shadow:0 20px 60px rgba(0,0,0,0.5); display:flex; flex-direction:column; align-items:center; gap:12px; }
        .side-balcony-title { background:var(--gold-dim); color:var(--gold); border:1px solid var(--gold); padding:6px 14px; border-radius:6px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:2px; }
        .side-balcony-content { display:flex; gap:5px; }
        .side-column { display:flex; flex-direction:column; gap:2px; }

        .row-container { display:flex; align-items:center; margin-bottom:5px; }
        .aisle-gap { margin-top:36px; }
        .row-number { width:60px; font-family:'DM Mono',monospace; font-size:10px; color:var(--text-muted); text-align:center; }
        .seats-row { display:flex; }
        .v-aisle { width:var(--aisle); flex-shrink:0; }

        /* ── SEATS ── */
        .seat { width:24px; height:26px; background:var(--seat-free); border:1px solid var(--seat-border); margin:0 1px; border-radius:4px 4px 3px 3px; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:8px; color:var(--text-muted); cursor:pointer; transition:background 0.08s, transform 0.08s, box-shadow 0.08s; user-select:none; }
        .seat:hover:not(.occupied) { border-color:var(--gold); transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,0.4); color:var(--gold); }
        .seat.selected { background:var(--selected) !important; border-color:#6a9dff !important; color:white !important; transform:translateY(-2px); box-shadow:0 0 12px rgba(74,125,252,0.5); }
        .seat.occupied { border-color:rgba(255,255,255,0.06) !important; color:rgba(255,255,255,0.7); }
        .seat.occupied:hover { transform:none; box-shadow:none; }

        /* ── STAGE ── */
        .stage { width:900px; height:60px; background:linear-gradient(135deg,#1e1a2e 0%,#2a2540 50%,#1e1a2e 100%); border:1px solid var(--gold); box-shadow:0 0 40px rgba(201,168,76,0.2),inset 0 1px 0 rgba(201,168,76,0.1); color:var(--gold); display:flex; align-items:center; justify-content:center; margin:36px auto 0; border-radius:0 0 100px 100px; font-family:'Playfair Display',serif; font-size:20px; letter-spacing:20px; }

        /* ── LEGEND ── */
        .legend { position:fixed; bottom:0; left:0; right:0; height:40px; background:var(--surface); border-top:1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:24px; font-size:11px; color:var(--text-muted); z-index:900; }
        .legend-item { display:flex; align-items:center; gap:7px; }
        .box { width:14px; height:14px; border-radius:3px; border:1px solid var(--seat-border); }

        /* ── PRINT ── */
        @media print {
            @page { size: portrait; margin: 0; }
            * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
            .header, .legend, .stats-panel { display:none !important; }
            html, body { width:100% !important; height:100% !important; overflow:hidden !important; background:white !important; }
            #zoom-container { width:100vw !important; height:100vh !important; display:flex !important; justify-content:center !important; align-items:flex-start !important; position:relative !important; overflow:hidden !important; }
            #hall-wrapper { position:relative !important; width:1400px !important; transform:scale(0.32) !important; transform-origin:top center !important; display:flex !important; flex-direction:column !important; align-items:center !important; margin:10mm 0 0 0 !important; padding:0 !important; }
            .sector-container { border:2px solid #444 !important; background:white !important; }
            .seat { background:#eee !important; color:#000 !important; border-color:#999 !important; }
            .seat.occupied { border:1px solid rgba(0,0,0,0.1) !important; }
            .sector-title { color:#333 !important; }
            .stage { background:#ddd !important; color:#333 !important; border-color:#999 !important; box-shadow:none !important; }
            .side-balcony-title { color:#333 !important; border-color:#999 !important; background:#f0f0f0 !important; }
            .side-balcony-container, .sector-container { border-color:#ccc !important; background:white !important; }
        }


        /* Светлая тема */
        body.light-theme {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface2: #f8f9fa;
            --border: #dcdde1;
            --gold: #b8860b; /* Чуть темнее для контраста на белом */
            --gold-light: #8b6508;
            --gold-dim: rgba(184, 134, 11, 0.1);
            --text: #1a1a1a;
            --text-muted: #636e72;
            --seat-free: #e1e4e8;
            --seat-border: #b2bec3;
        }

        /* Стиль для кнопки переключения */
        .theme-toggle {
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
            user-select: none;
        }
        .theme-toggle:hover {
            background: var(--surface2);
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-brand">🎭 Рассадка</div>
    <div class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">🌙</div>
    <div class="divider"></div>
    <div class="input-group">
        <input type="text" id="groupInput" placeholder="Название группы">
        <input type="color" id="colorPicker" value="#c9a84c">
    </div>
    <button class="btn btn-primary" onclick="assign()">Подписать</button>
    <button class="btn btn-danger" onclick="setEraser()">✕ Ластик</button>
    <div class="divider"></div>
    <button class="btn btn-export" onclick="downloadJSON()">↓ JSON</button>
    <button class="btn btn-ghost" onclick="document.getElementById('fileInput').click()">↑ Загрузить</button>
    <input type="file" id="fileInput" style="display:none" accept=".json" onchange="loadJSON(event)">
    <button class="btn btn-export" onclick="exportExcel()">↓ Excel</button>
    <button class="btn btn-export" onclick="exportPDF()">PDF</button>
    <button class="btn btn-ghost" onclick="resetSelected()">Сбросить</button>
    <span id="counter">Выбрано: <b>0</b></span>
</div>

<div id="stats" class="stats-panel">
    <div class="stats-title">Статистика</div>
    <div id="statsList"><div class="stats-empty">Нет данных</div></div>
</div>

<div id="zoom-container">
    <div id="hall-wrapper">
        <div id="hall" class="hall-viewport">
            <div class="sector-container" id="balcony-sector">
                <div class="sector-title">Балкон</div>
                <div id="balcony-content"></div>
            </div>
            <div class="parter-layout-container">
                <div class="side-balcony-wrapper" id="left-side-wrapper"></div>
                <div class="sector-container" id="parter-sector">
                    <div class="sector-title">Партер</div>
                    <div id="parter-content"></div>
                </div>
                <div class="side-balcony-wrapper" id="right-side-wrapper"></div>
            </div>
            <div class="stage">С Ц Е Н А</div>
        </div>
    </div>
</div>

<div class="legend">
    <div class="legend-item"><div class="box"></div> Свободно</div>
    <div class="legend-item"><div class="box" style="background:var(--selected);border-color:#6a9dff"></div> Выбрано</div>
    <div class="legend-item"><div class="box" style="background:#c9a84c;border-color:#c9a84c"></div> Занято</div>
    <div class="legend-item" style="margin-left:16px;color:#5a5670;font-size:10px">Колёсико — масштаб &nbsp;·&nbsp; Drag — перемещение</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
    const layout = [
        34, 36, 36, 38, 38, 39, 39, 40, 42, 39,
        42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42, 42,
        36,
        38, 38, 38, 38, 32, 20, 22, 22
    ];

    let db = {}, selected = [], isMouseDown = false, selectionMode = true;
    let scale = 0.5, translateX = 100, translateY = 50;

    const wrapper   = document.getElementById('hall-wrapper');
    const container = document.getElementById('zoom-container');

    function applyTransform() { wrapper.style.transform = `translate(${translateX}px,${translateY}px) scale(${scale})`; }
    applyTransform();

    container.onwheel = (e) => {
        e.preventDefault();

        // 1. Запоминаем положение курсора относительно контейнера
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // 2. Вычисляем "мировую" координату под курсором (точку на самой схеме)
        const worldX = (mouseX - translateX) / scale;
        const worldY = (mouseY - translateY) / scale;

        // 3. Определяем новый масштаб
        const delta = e.deltaY > 0 ? -0.05 : 0.05;
        const newScale = Math.min(Math.max(0.1, scale + delta), 2);

        // 4. Пересчитываем смещение, чтобы точка worldX/worldY осталась под курсором
        translateX = mouseX - worldX * newScale;
        translateY = mouseY - worldY * newScale;
        scale = newScale;

        applyTransform();
    };

    let isDragging = false, startX, startY;
    container.onmousedown = (e) => { if (e.target.classList.contains('seat')) return; isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; };
    window.onmousemove = (e) => { if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - startY; applyTransform(); };
    window.onmouseup = () => { isDragging = false; isMouseDown = false; };

    const parterContent  = document.getElementById('parter-content');
    const balconyContent = document.getElementById('balcony-content');

    for (let i = layout.length - 1; i >= 0; i--) {
        const rowNum = i + 1;
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row-container';
        if (rowNum === 9) rowDiv.classList.add('aisle-gap');

        const labelL = document.createElement('div');
        labelL.className = 'row-number';
        labelL.innerText = rowNum > 25 ? `Ряд ${rowNum - 25}` : `Ряд ${rowNum}`;
        rowDiv.appendChild(labelL);

        const sw = document.createElement('div');
        sw.className = 'seats-row';
        sw.style.cssText = 'display:flex;justify-content:center';

        let seatNums = [];
        if (rowNum <= 5) seatNums.push('0','0.1'); else if (rowNum === 6 || rowNum === 7) seatNums.push('0');
        for (let s = 1; s <= layout[i]; s++) seatNums.push(String(s));

        const mkDiv = (style) => Object.assign(document.createElement('div'), {style});
        const vAisle = () => Object.assign(document.createElement('div'), {className:'v-aisle'});

        if (rowNum === 25) {
            sw.style.minWidth = '1230px';
            seatNums.forEach(num => { sw.appendChild(createSeat(rowNum, num)); if (num==='12'||num==='24') sw.appendChild(mkDiv('width:60px')); });
        } else if (rowNum >= 26 && rowNum <= 29) {
            const [p1,p2,p3] = [0,1,2].map(()=>mkDiv('display:flex'));
            seatNums.forEach(num => { const s=createSeat(rowNum,num),n=parseInt(num); (n<=11?p1:n<=27?p2:p3).appendChild(s); });
            [p1,vAisle(),p2,vAisle(),p3].forEach(el=>sw.appendChild(el));
        } else if (rowNum === 30) {
            sw.appendChild(mkDiv('width:28px'));
            const [p1,p2,p3] = [0,1,2].map(()=>mkDiv('display:flex'));
            seatNums.forEach(num => { const s=createSeat(rowNum,num),n=parseInt(num); (n<=10?p1:n<=22?p2:p3).appendChild(s); });
            const midG=mkDiv('display:flex'); midG.appendChild(vAisle()); midG.appendChild(mkDiv('width:60px'));
            const endG=mkDiv('display:flex'); endG.appendChild(mkDiv('width:52px')); endG.appendChild(vAisle());
            [p1,midG,p2,endG,p3].forEach(el=>sw.appendChild(el));
        } else if (rowNum === 31) {
            const dot=()=>mkDiv('width:28px');
            sw.appendChild(dot());
            const [p1,p2]=[0,1].map(()=>mkDiv('display:flex'));
            seatNums.forEach(num => (parseInt(num)<=10?p1:p2).appendChild(createSeat(rowNum,num)));
            [p1,vAisle(),mkDiv('width:450px'),vAisle(),p2,dot()].forEach(el=>sw.appendChild(el));
        } else if (rowNum >= 32) {
            const [p1,p2]=[0,1].map(()=>mkDiv('display:flex'));
            seatNums.forEach(num => (parseInt(num)<=11?p1:p2).appendChild(createSeat(rowNum,num)));
            [p1,vAisle(),mkDiv('width:450px'),vAisle(),p2].forEach(el=>sw.appendChild(el));
        } else {
            const left=mkDiv('display:flex;justify-content:flex-end;min-width:620px');
            const right=mkDiv('display:flex;justify-content:flex-start;min-width:620px');
            const splitMap={1:'16',2:'17',3:'17',4:'18',5:'18',6:'19',7:'19',8:'20',9:'21'};
            const splitAt=splitMap[rowNum]||seatNums[Math.floor(seatNums.length/2)-1];
            let isRight=false;
            seatNums.forEach(num => { (isRight?right:left).appendChild(createSeat(rowNum,num)); if(num===splitAt)isRight=true; });
            [left,vAisle(),right].forEach(el=>sw.appendChild(el));
        }

        rowDiv.appendChild(sw);
        rowDiv.appendChild(labelL.cloneNode(true));
        (rowNum >= 26 ? balconyContent : parterContent).appendChild(rowDiv);
    }

    function renderSideBalcony(wrapperId, titleText, prefix) {
        const cont = document.createElement('div'); cont.className = 'side-balcony-container';
        const title = document.createElement('div'); title.className = 'side-balcony-title'; title.innerText = titleText;
        cont.appendChild(title);
        const content = document.createElement('div'); content.className = 'side-balcony-content';

        // ПЕРВАЯ вертикаль (теперь здесь места с 17 по 32)
        const col1 = document.createElement('div'); col1.className = 'side-column';
        const off = document.createElement('div'); off.style.height='28px'; col1.appendChild(off); // Смещение для выравнивания
        for (let i=17; i<=32; i++) col1.appendChild(createSeat(prefix, i));

        // ВТОРАЯ вертикаль (теперь здесь места с 1 по 16 и 33)
        const col2 = document.createElement('div'); col2.className = 'side-column';
        for (let i=1; i<=16; i++) col2.appendChild(createSeat(prefix, i));
        const sp = document.createElement('div'); sp.style.height='10px'; col2.appendChild(sp); // Пробел перед 33-м местом
        col2.appendChild(createSeat(prefix, 33));

        // Располагаем колонки так, чтобы 17-32 всегда были "внутренними" (ближе к центру)
        if (titleText === 'Левый балкон') {
            // Левый балкон (на экране справа): 17-32 слева, 1-16 справа
            content.appendChild(col1);
            content.appendChild(col2);
        } else {
            // Правый балкон (на экране слева): 1-16 слева, 17-32 справа
            content.appendChild(col2);
            content.appendChild(col1);
        }

        cont.appendChild(content);
        document.getElementById(wrapperId).appendChild(cont);
    }
    renderSideBalcony('left-side-wrapper',  'Правый балкон',  'ПБ');
    renderSideBalcony('right-side-wrapper', 'Левый балкон', 'ЛБ');

    function createSeat(row, num) {
        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.innerText = num;
        const key = `${row}-${num}`;
        seat.id = `s-${key}`;
        seat.onmousedown = (e) => {
            e.stopPropagation(); isMouseDown = true;
            if (db[key]) { document.getElementById('groupInput').value = db[key].group; document.getElementById('colorPicker').value = db[key].color; }
            selectionMode = !selected.includes(key);
            toggleSeat(seat, key, selectionMode);
        };
        seat.onmouseenter = () => { if (isMouseDown) toggleSeat(seat, key, selectionMode); };
        return seat;
    }

    function toggleSeat(el, key, mode) {
        if (mode && !selected.includes(key)) { selected.push(key); el.classList.add('selected'); }
        else if (!mode && selected.includes(key)) { selected.splice(selected.indexOf(key),1); el.classList.remove('selected'); }
        document.getElementById('counter').innerHTML = `Выбрано: <b>${selected.length}</b>`;
    }

    function assign() {
        const g = document.getElementById('groupInput').value.trim();
        const c = document.getElementById('colorPicker').value;
        if (!g || !selected.length) return alert('Введите группу и выберите места!');
        selected.forEach(k => {
            db[k] = {group:g, color:c};
            const el = document.getElementById(`s-${k}`);
            if (el) { el.classList.replace('selected','occupied'); el.style.backgroundColor=c; el.title=g; }
        });
        resetSelected(); updateStats();
    }

    function setEraser() {
        selected.forEach(k => {
            delete db[k];
            const el = document.getElementById(`s-${k}`);
            if (el) { el.classList.remove('selected','occupied'); el.style.backgroundColor=''; el.title=''; }
        });
        resetSelected(); updateStats();
    }

    function resetSelected() {
        selected.forEach(k => { const el=document.getElementById(`s-${k}`); if(el) el.classList.remove('selected'); });
        selected = [];
        document.getElementById('counter').innerHTML = `Выбрано: <b>0</b>`;
    }

    function updateStats() {
        const list = document.getElementById('statsList');
        list.innerHTML = '';
        const counts = {};
        Object.values(db).forEach(v => { const k=`${v.group}||${v.color}`; counts[k]=(counts[k]||0)+1; });
        if (!Object.keys(counts).length) { list.innerHTML='<div class="stats-empty">Нет данных</div>'; return; }
        Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([data,count]) => {
            const [n,col] = data.split('||');
            const r = document.createElement('div'); r.className='stat-row';
            r.innerHTML = `<div class="stat-color" style="background:${col}"></div><div class="stat-name">${n}</div><span class="stat-count">${count}</span>`;
            list.appendChild(r);
        });
    }

    function downloadJSON() {
        const data = Object.entries(db).map(([k,v])=>({row:k.split('-')[0],seat:k.split('-')[1],group:v.group,color:v.color}));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
        a.download='seating.json'; a.click();
    }

    function loadJSON(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const data = JSON.parse(ev.target.result);
            document.querySelectorAll('.seat').forEach(s=>{s.className='seat';s.style.backgroundColor='';s.title='';});
            db = {};
            data.forEach(item => {
                const k=`${item.row}-${item.seat}`; db[k]={group:item.group,color:item.color};
                const el=document.getElementById(`s-${k}`);
                if(el){el.classList.add('occupied');el.style.backgroundColor=item.color;el.title=item.group;}
            });
            updateStats();
        };
        reader.readAsText(e.target.files[0]);
    }

    async function exportExcel() {
        const data = Object.entries(db).map(([k,v])=>({row:k.split('-')[0],seat:k.split('-')[1],group:v.group,color:v.color}));
        const res = await fetch('/export_excel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        if (res.ok) { const b=await res.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='seating.xlsx'; a.click(); }
    }

    function exportPDF() {
        const oldTitle = document.title;
        document.title = 'Рассадка — ' + new Date().toLocaleDateString('ru-RU');
        const wasSelected = [...selected]; resetSelected();
        window.print();
        document.title = oldTitle;
        wasSelected.forEach(key => { const el=document.getElementById(`s-${key}`); if(el)toggleSeat(el,key,true); });
    }

    // Логика темы
    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
    }

    // Проверка темы при загрузке
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('themeBtn').innerText = '☀️';
    }

</script>
</body>
</html>
